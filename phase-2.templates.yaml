  POSTGRES_PASSWORD_SLAVE: replicator_password
  POSTGRES_DB_SLAVE: my_db
  SLAVE_HOST: tracking-system-phase-2-db-slave
  SLAVE_PORT: "5432"
  PORT: "8000"
