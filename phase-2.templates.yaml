---
# Source: phase-2/templates/db-master-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-system-phase-2-db-master
  labels:
    app: phase-2
    role: db-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase-2
      role: db-master
  template:
    metadata:
      labels:
        app: phase-2
        role: db-master
    spec:
      containers:
        - name: db-master
          image: "postgres:14-alpine"
          imagePullPolicy: IfNotPresent
          # Listen on port 5432
          ports:
            - containerPort: 5432

          # Avoid multiline environment var. If you must keep it, remove the '\n' or
          # handle it in a custom config file.
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "master_password"
            - name: POSTGRES_DB
              value: "my_db"
            # If you need 'POSTGRES_HOST_AUTH_METHOD', keep it simple:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
            # Possibly remove or adjust this if not needed
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"

          # Let the official entrypoint handle user creation and init scripts
          command:
            - "docker-entrypoint.sh"
          # Pass your custom flags to Postgres via args
          args:
            - "postgres"
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "hot_standby=on"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "max_replication_slots=10"
            - "-c"
            - "hot_standby_feedback=on"

          # Mount your init SQL script
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: tracking-system-phase-2-init-sql
            # Mount the key that matches the script name
            items:
              - key: 00_init.sql
                path: 00_init.sql
---
# Source: phase-2/templates/db-slave-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-system-phase-2-db-slave
  labels:
    app: phase-2
    role: db-slave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase-2
      role: db-slave
  template:
    metadata:
      labels:
        app: phase-2
        role: db-slave
    spec:
      containers:
        - name: db-slave
          image: "postgres:14-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: PGUSER
              value: "replicator"
            - name: PGPASSWORD
              value: "replicator_password"
          command:
            - "bash"
          args:
            - "-c"
            - |
              until pg_basebackup --pgdata=/var/lib/postgresql/data \
                                  -R \
                                  --slot=replication_slot \
                                  --host=tracking-system-phase-2-db-master \
                                  --port=5432;
              do
                echo "Waiting for master...";
                sleep 2;
              done;
              echo "Base backup completed. Starting replica...";
              chmod 0700 /var/lib/postgresql/data;
              exec postgres
---
# Source: phase-2/templates/django-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-system-phase-2-django
  labels:
    app: phase-2
    tier: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase-2
      tier: django
  template:
    metadata:
      labels:
        app: phase-2
        tier: django
    spec:
      containers:
        - name: django
          image: "tracking-system:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: tracking-system-phase-2-django
          command:
            - "sh"
          args:
            - "-c"
            - |
              python manage.py makemigrations && \
              python manage.py migrate && \
              python manage.py runserver 0.0.0.0:8000
