version: "3.8"

x-postgres-common: &postgres-common
  image: postgres:14-alpine
  user: postgres
  restart: always
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d my_db"]
    interval: 5s
    timeout: 5s
    retries: 5


services:
  django:
    build:
      context: .
    env_file:
      - .env
      - .env.master
      - .env.slave
    container_name: django_server_cloud
    restart: always
    ports:
      - "${PORT}:${PORT}"
    command: >
      sh -c "
      python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:${PORT}"
    depends_on:
      - db_master
      - db_slave
    networks:
      - django_redis_net
    dns:
      - 8.8.8.8  # Google's public DNS server
      - 8.8.4.4

  db_master:
    <<: *postgres-common
    container_name: master_db
    ports:
      - "5482:5432"              # Host port 5482 -> Container port 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: master_password
      POSTGRES_DB: my_db
      # Allows replication connections (overrides defaults in pg_hba.conf).
      # Use single-line text instead of multi-line to avoid YAML parsing problems.
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256\nhost replication all 0.0.0.0/0 md5"
      # Ensures host-based authentication uses scram-sha-256.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # Make sure this is a SINGLE-LINE command so the entrypoint doesn't misread line breaks.
    command: "postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on"
    volumes:
      - ./00_init.sql:/docker-entrypoint-initdb.d/00_init.sql
    networks:
      - django_redis_net


  db_slave:
    <<: *postgres-common
    container_name: slave_db
    ports:
      - "5473:5432"              # Host port 5473 -> Container port 5432
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_password
    depends_on:
      - db_master
    # Single-line for the 'until' loop to avoid hidden carriage returns or YAML multiline issues
    command: >
      bash -c "until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=db_master --port=5432;
               do echo 'Waiting for master...'; sleep 2; done;
               echo 'Base backup completed. Starting replica...';
               chmod 0700 /var/lib/postgresql/data;
               exec postgres"
    networks:
      - django_redis_net

networks:
  django_redis_net:
    driver: bridge

volumes:
  master_data:
  slave_data:
